name: Shop maintenance off
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Inspect shop FTP root and locate maintenance drop-in
        env:
          HOST: ${{ secrets.THREEW_SHOP_FTP_HOST }}
          PORT: ${{ secrets.THREEW_SHOP_FTP_PORT }}
          USER: ${{ secrets.THREEW_SHOP_FTP_USER }}
          PASS: ${{ secrets.THREEW_SHOP_FTP_PASS }}
        run: |
          set -uo pipefail
          lftp -u "$USER","$PASS" -p "$PORT" "ftps://$HOST" <<'CMDS' || true
          set ssl:verify-certificate yes
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set net:timeout 20
          set net:max-retries 2
          pwd
          ls
          cd ..
          pwd
          ls
          cd -
          CD wp-content
          pwd
          ls maintenance.php maintenance 2>/dev/null
          CMDS
